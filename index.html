:root{
  /* Nahdi Online palette */
  --blue:#2c6ba4;--blue2:#1152a9;--blue-soft:#eaf2fa;--green:#39a83b;--green-soft:#e8f6e8;--teal:#1188a9;--teal-soft:#e3f3f8;
  --red:#d10404;--danger:#d10404;--orange:#e96424;
  --bg:#f4f8fa;--card:#ffffff;--card2:#f4f8fa;--line:#e8e8e8;--line2:#d7dee6;
  --txt:#424242;--ink:#1f2d3d;--mut:#757575;--mut2:#a3a2a2;
  --r:16px;--shadow:0 2px 10px rgba(17,82,169,.07);
  --font:'Tajawal',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --latin:'Montserrat','Tajawal',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--txt);overscroll-behavior-y:none}
svg.i{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}
.app{max-width:780px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* header: Nahdi blue */
header{position:sticky;top:0;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:linear-gradient(160deg,var(--blue) 0%,var(--blue2) 100%);color:#fff;box-shadow:0 4px 18px rgba(17,82,169,.25);border-radius:0 0 22px 22px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--blue);background:#fff;position:relative}
.logo svg{width:23px;height:23px}
.logo::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--green);border:2.5px solid #fff;bottom:-3px;inset-inline-start:-3px}
.brand h1{font-size:19px;margin:0;font-weight:800;color:#fff}
.brand .sub{font-size:12.5px;color:rgba(255,255,255,.78);font-weight:500;margin-top:1px}
.brand .sp{flex:1}
.net{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;gap:6px}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:#ffb4a8}
.net.on::before{background:#7ee07f}
.searchbar{display:flex;gap:9px}
.inp{position:relative;flex:1}
.inp>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--blue)}
#q{width:100%;height:50px;border-radius:14px;border:0;background:#fff;color:var(--ink);
  font:700 16.5px var(--font);padding:0 46px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#q::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
#q::placeholder{color:var(--mut2);font-weight:500}
#q:focus{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.clear{position:absolute;inset-inline-end:9px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;
  background:var(--card2);color:var(--mut);display:none;place-items:center;cursor:pointer}
.clear.show{display:grid}.clear svg{width:16px;height:16px}
.scanbtn{width:50px;height:50px;border-radius:14px;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;background:var(--green);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.scanbtn svg{width:26px;height:26px}
.chips{display:flex;gap:7px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;padding:7px 13px;border-radius:999px;
  font:700 13.5px var(--font);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip svg{width:15px;height:15px}
.chip.active{background:#fff;border-color:#fff;color:var(--blue2)}
.chip[data-f=express].active{color:var(--green)}
.chip[data-f=global].active{color:var(--teal)}
.chip[data-f=sl].active{color:var(--orange)}
.tag.sl{background:#fdeee6;color:var(--orange)}
.scat{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5}
.scat b{color:var(--blue2);font-weight:700;text-transform:capitalize;font-family:var(--latin)}

main{flex:1;padding:14px 14px 100px}
.count{color:var(--mut);font-size:13.5px;font-weight:500;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.count b{color:var(--ink);font-weight:800}

/* product card */
.card{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px;margin-bottom:9px;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.card:active{transform:scale(.99)}
.card:hover{border-color:#b9cfe6}
.thumb{width:76px;height:76px;flex:0 0 auto;border-radius:12px;background:#fff;border:1px solid #f0f0f0;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.thumb img.ok{opacity:1}
.thumb.none{background:var(--blue-soft);border-color:transparent;color:#8fb3d6}
.thumb.none svg{width:30px;height:30px}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-size:15.5px;font-weight:700;line-height:1.5;color:var(--ink);padding-inline-end:32px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.en{font:500 12px var(--latin);color:var(--mut);direction:ltr;text-align:right;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.price{font:800 17px var(--latin);color:var(--red);direction:ltr;display:flex;align-items:baseline;gap:4px}
.price small{font:700 11px var(--font);color:var(--mut)}
.price.na{color:var(--mut2);font:600 13px var(--font)}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px 2px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.tag svg{width:12px;height:12px}
.tag.e{background:var(--green-soft);color:var(--green)}
.tag.g{background:var(--teal-soft);color:var(--teal)}
.tag.o{background:#fdeee6;color:var(--orange)}
.code{font:600 12px var(--latin);color:var(--blue);direction:ltr;margin-inline-start:auto;letter-spacing:.3px}
.star{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border:0;border-radius:10px;background:transparent;color:#c4c4c4;cursor:pointer;display:grid;place-items:center}
.star svg{width:19px;height:19px}
.star.on{color:#f2a900}.star.on svg{fill:currentColor}
mark{background:#fff2b8;color:inherit;border-radius:3px;padding:0 1px}
.more{display:flex;margin:8px auto 0;padding:12px 22px}

.hint{color:var(--mut);text-align:center;padding:30px 14px;font-size:15px;line-height:1.85}
.hint .ic{width:70px;height:70px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.hint .ic svg{width:32px;height:32px}
.hint b{color:var(--ink);font-size:18px;font-weight:800}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;text-align:start}
.tips div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:13px;line-height:1.6;box-shadow:var(--shadow)}
.tips div b{display:block;font-size:14px;margin-bottom:2px;color:var(--blue2)}
.ver{font-size:11.5px;color:var(--mut2);margin-top:16px}

.btn{border:0;border-radius:12px;padding:12px 18px;font:700 15px var(--font);cursor:pointer;color:#fff;background:var(--blue);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.notfound{text-align:center;padding:26px 16px;background:#fff;border:1.5px dashed var(--line2);border-radius:var(--r)}
.notfound h3{margin:10px 0 4px;font-size:17px;color:var(--ink)}
.notfound p{color:var(--mut);margin:0 0 14px;font:600 14px var(--latin);direction:ltr}

/* scanner */
.scanner{position:fixed;inset:0;z-index:100;background:#000;display:none}
.scanner.show{display:block}
.scanner video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.frame .box{width:78%;max-width:360px;aspect-ratio:1.5;border-radius:20px;box-shadow:0 0 0 2000px rgba(0,0,0,.5);position:relative}
.frame .box::before{content:"";position:absolute;inset:0;border-radius:20px;border:3px solid #fff}
.frame .laser{position:absolute;left:7%;right:7%;height:2px;background:var(--green);box-shadow:0 0 12px var(--green);top:50%}
.stop{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:space-between;align-items:center;z-index:2;color:#fff}
.stop b{font-size:17px}
.rbtn{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer}
.rbtn.on{background:#fff;color:#000}
.sbot{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;z-index:2;font-size:15px;font-weight:700;text-shadow:0 1px 4px #000;display:flex;flex-direction:column;align-items:center;gap:14px}

/* product sheet */
.modal{position:fixed;inset:0;z-index:150;background:rgba(14,35,64,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;color:var(--txt);width:100%;max-width:540px;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  position:relative;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .24s cubic-bezier(.2,.8,.2,1);max-height:94vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:5px;background:#e0e0e0;margin:0 auto 10px}
.x{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border:0;border-radius:50%;background:var(--card2);color:var(--txt);cursor:pointer;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;padding-inline-end:40px}
.pimg{width:100px;height:100px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:#fff;color:#8fb3d6}
.pimg img{width:100%;height:100%;object-fit:contain}
.pimg svg{width:34px;height:34px}
.sname{font-size:18px;font-weight:800;line-height:1.5;color:var(--ink)}
.sen{font:500 12.5px var(--latin);color:var(--mut);direction:ltr;text-align:right;margin-top:2px}
.stags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pbox{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg)}
.pbox .l{font:600 12px var(--font);color:var(--mut)}
.pbox .v{font:800 20px var(--latin);direction:ltr;text-align:right;color:var(--ink)}
.pbox .v small{font:700 12px var(--font);color:var(--mut)}
.pbox .v s{font-size:13px;color:var(--mut2);font-weight:600;margin-inline-start:6px}
.pbox.main .v{color:var(--red)}
.pbox.code{cursor:pointer}.pbox.code .v{font-size:18px;color:var(--blue)}
.bcview{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px;display:grid;place-items:center;min-height:210px;margin:0 auto 8px;max-width:330px}
.bcview svg{width:100%;height:auto;max-width:290px;display:block}
.bcnum{text-align:center;font:800 21px var(--latin);letter-spacing:2px;margin-bottom:10px;direction:ltr;color:var(--ink)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:0 auto 10px;max-width:330px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font:700 14px var(--font);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button.active{background:var(--blue);color:#fff}
.bcother{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.bcother::-webkit-scrollbar{display:none}
.bcchip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--txt);border-radius:10px;padding:7px 11px;font:600 12px var(--latin);cursor:pointer;direction:ltr}
.bcchip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.acts .btn{font-size:14.5px;padding:12px 10px}
.acts .btn.light{background:var(--blue-soft);color:var(--blue2)}
.tip{text-align:center;color:var(--mut);font-size:12.5px;line-height:1.7;margin-top:10px}
.modal.bright{background:#fff}

.toast{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;

<script>
'use strict';
const $=s=>document.querySelector(s);
const VER='٦';
let ITEMS=[],IMGBASE='',BUILT='',HAY=[],bcMap=new Map(),codeIndex=new Map(),itemBc=[],nExp=0,nGlob=0;
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let fav=new Set(LS.get('fav',[])),recent=LS.get('recent',[]),missing=LS.get('missing',[]);
let filter='all',lastQ='',lastRes=[],shown=0;
const PAGE=40;
// item fields
const F={code:0,en:1,ar:2,price:3,img:4,type:5,op:6,dp:7,vat:8,brand:9,cat:10,sl:11};
let CATS=[],nSL=0;
const VAT=1.15;

/* ---------- text normalisation ---------- */
function norm(s){return (s||'').toString().toLowerCase()
  .replace(/[\u064B-\u0652\u0640]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
  .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/[^a-z0-9\u0621-\u064a.%+]+/g,' ').replace(/\s+/g,' ').trim();}
function bcRank(b){if(b.startsWith('7777'))return 0;if(b.startsWith('8888'))return 1;if(b.startsWith('5555'))return 2;if(b.startsWith('9990'))return 3;if(b.length===13)return 4;return 5;}

/* ---------- load ---------- */
async function load(){
  const fill=$('#lfill'),ltxt=$('#ltxt');
  try{
    const res=await fetch('data.pack');
    const len=+res.headers.get('Content-Length')||6000000;
    const reader=res.body.getReader();let got=0,chunks=[];
    for(;;){const{done,value}=await reader.read();if(done)break;chunks.push(value);got+=value.length;fill.style.width=Math.min(60,got/len*60)+'%';}
    ltxt.textContent='جاري فك الضغط…';fill.style.width='70%';
    const txt=await new Response(new Blob(chunks).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    ltxt.textContent='جاري التجهيز…';fill.style.width='85%';
    await new Promise(r=>setTimeout(r,20));
    const b=JSON.parse(txt);
    ITEMS=b.items;IMGBASE=b.imgBase||'';BUILT=b.built||'';CATS=b.cats||[];
    HAY=new Array(ITEMS.length);
    for(let i=0;i<ITEMS.length;i++){const it=ITEMS[i];codeIndex.set(it[0],i);
      HAY[i]=' '+norm(it[2])+' '+(it[1]!==it[2]?norm(it[1])+' ':'')+(it[9]?norm(it[9])+' ':'')+it[0]+' ';
      if(it[11])nSL++;
      if(it[5]==='e')nExp++;else if(it[5]==='g')nGlob++;}
    bcMap=new Map(b.bc);
    itemBc=Array.from({length:ITEMS.length},()=>[]);
    for(const p of b.bc){if(itemBc[p[1]])itemBc[p[1]].push(p[0]);}
    for(const a of itemBc)a.sort((x,y)=>bcRank(x)-bcRank(y)||x.length-y.length);
    fill.style.width='100%';
    $('#subcount').textContent=ITEMS.length.toLocaleString('ar-EG')+' صنف • '+(nExp+nGlob).toLocaleString('ar-EG')+' أونلاين';
    $('#loader').style.opacity=0;setTimeout(()=>$('#loader').remove(),350);
    const p=new URLSearchParams(location.search).get('q');
    if(p){$('#q').value=p;onInput();}else render();
  }catch(e){ltxt.textContent='تعذّر تحميل الداتا — افتح الصفحة تاني وانت متصل بالنت';console.error(e);}
}

/* ---------- search ---------- */
function findBarcode(raw){
  let i=bcMap.get(raw);if(i!=null)return i;
  if(codeIndex.has(raw))return codeIndex.get(raw);
  const s=raw.replace(/^0+/,'');i=bcMap.get(s);if(i!=null)return i;
  i=bcMap.get('0'+raw);if(i!=null)return i;
  return null;
}
function search(q){
  const raw=(q||'').trim();if(!raw)return[];
  if(/^\d{6,}$/.test(raw)){const i=findBarcode(raw);if(i!=null)return[i];}
  const nq=norm(raw);if(!nq)return[];
  const toks=nq.split(' ');
  const res=[];
  for(let i=0;i<HAY.length;i++){
    const h=HAY[i];let ok=true;
    let score=toks.length<2?0:h.indexOf(' '+nq+' ')>=0?0:h.indexOf(' '+nq)>=0?1:3;
    for(let k=0;k<toks.length;k++){
      const t=toks[k];
      // prefer a whole-word hit, then a word-start hit, then anywhere
      let p=h.indexOf(' '+t+' ');
      if(p>=0){score+=0;continue;}
      p=h.indexOf(' '+t);
      if(p>=0){score+=2;continue;}
      if(h.indexOf(t)<0){ok=false;break;}
      score+=5;
    }
    if(ok)res.push(i*64+Math.min(63,score));
  }
  if(res.length){
    // sort by score, then name length
    res.sort((a,b)=>(a&63)-(b&63)||HAY[a>>6].length-HAY[b>>6].length);
    return res.map(x=>x>>6);
  }
  return fuzzy(toks);
}
function lev(a,b,max){
  const m=a.length,n=b.length;if(Math.abs(m-n)>max)return max+1;
  let prev=new Array(n+1);for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){const cur=new Array(n+1);cur[0]=i;let best=i;const ai=a.charCodeAt(i-1);
    for(let j=1;j<=n;j++){let v=prev[j]+1;const d=cur[j-1]+1;if(d<v)v=d;const e=prev[j-1]+(ai===b.charCodeAt(j-1)?0:1);if(e<v)v=e;cur[j]=v;if(v<best)best=v;}
    if(best>max)return max+1;prev=cur;}
  return prev[n];
}
function th(t){const n=t.length;return n<=3?0:n<=5?1:n<=8?2:3;}
// Arabic spelling skeleton: drop long vowels so «بندول» ≈ «بانادول»
const isAr=s=>/[ء-ي]/.test(s);
const skel=s=>s.replace(/[اويىءه]/g,'');
function fuzzy(toks){
  const T=toks.map(t=>[t,th(t),isAr(t)&&skel(t).length>=3?skel(t):'']);const out=[];
  for(let i=0;i<HAY.length;i++){
    const words=HAY[i].trim().split(' ');let total=0,ok=true;
    for(const [t,m,sk] of T){
      let best=Math.max(m,sk?1:0)+1;
      for(const w of words){
        if(w.includes(t)){best=0;break;}
        if(sk&&best>1&&skel(w).startsWith(sk)){best=1;continue;}
        if(m===0)continue;
        let d=lev(t,w,m);
        if(w.length>t.length){const d2=lev(t,w.slice(0,t.length),m);if(d2<d)d=d2;}
        if(d<best){best=d;}
      }
      if(best>Math.max(m,sk?1:0)){ok=false;break;}total+=best;
    }
    if(ok)out.push([i,total]);
  }
  if(!out.length)return[];
  out.sort((a,b)=>a[1]-b[1]||HAY[a[0]].length-HAY[b[0]].length);
  const lim=out[0][1]+1; // keep only the closest matches, drop noise
  return out.filter(x=>x[1]<=lim).map(x=>x[0]);
}

/* ---------- render ---------- */
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imgUrl(p,size){return p?IMGBASE+p+`?width=${size}&height=${size}&canvas=${size},${size}&optimize=high&bg-color=255,255,255&fit=bounds`:'';}
function fmt(v){const n=parseFloat(v);if(!(n>0))return'';return (Math.round(n*100)/100).toString();}
function priceInfo(it){
  const store=fmt(it[F.price]),on=fmt(it[F.op]),disc=fmt(it[F.dp]);
  // vat: 1 = 15% applies (not a medicine), 0 = medicine (no VAT), '' = unknown
  const vat=it[F.vat];
  if(store){
    if(vat===1)return{v:fmt(store*VAT),pre:store,src:'s',vat,on,disc};
    return{v:store,pre:store,src:'s',vat,on,disc};
  }
  if(on)return{v:on,src:'o',vat,on,disc};
  return{v:'',src:'',vat,on,disc};
}
function row(l,v,old){return `<div class="pbox" style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:center"><div class="l">${l}</div><div class="v" style="font-size:17px">${v} <small>ر.س</small>${old?`<s>${old}</s>`:''}</div></div>`;}
function tagHTML(t){return t==='e'?'<span class="tag e"><svg class="i"><use href="#i-bolt"/></svg>إكسبريس</span>':t==='g'?'<span class="tag g"><svg class="i"><use href="#i-globe"/></svg>جلوبال</span>':'';}
function card(idx){
  const it=ITEMS[idx],pi=priceInfo(it),on=fav.has(it[0]);
  const d=document.createElement('div');d.className='card';d.dataset.idx=idx;
  const im=it[F.img];
  d.innerHTML=`<div class="thumb${im?'':' none'}">${im?`<img loading="lazy" decoding="async" alt="" src="${imgUrl(im,160)}" onload="this.classList.add('ok')" onerror="this.parentNode.classList.add('none');this.replaceWith(document.querySelector('#tplbox').content.cloneNode(true))">`:'<svg class="i"><use href="#i-box"/></svg>'}</div>
  <div class="info">
    <div class="nm">${hl(it[2]||it[1])}</div>
    ${it[1]&&it[1]!==it[2]?`<div class="en">${hl(it[1])}</div>`:''}
    <div class="row">
      ${pi.v?`<span class="price">${pi.v}<small>ر.س</small>${pi.src==='o'?'<small>أونلاين</small>':pi.vat===1?'<small>بالضريبة</small>':''}</span>`:'<span class="price na">بدون سعر</span>'}
      ${tagHTML(it[F.type])}${it[F.sl]?'<span class="tag sl">SL</span>':''}
      <span class="code">${esc(it[0])}</span>
    </div>
  </div>
  <button class="star${on?' on':''}" data-star="${it[0]}" aria-label="مفضلة"><svg class="i"><use href="#i-star"/></svg></button>`;
  return d;
}
let HLT=[];
function hl(s){
  let e=esc(s);if(!HLT.length)return e;
  // highlight raw query tokens in display text (case-insensitive, latin/digits only + arabic exact)
  for(const t of HLT){if(t.length<2)continue;
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');e=e.replace(re,'<mark>$1</mark>');}
  return e;
}
function applyType(list){
  if(filter==='express')return list.filter(i=>ITEMS[i][F.type]==='e');
  if(filter==='global')return list.filter(i=>ITEMS[i][F.type]==='g');
  if(filter==='sl')return list.filter(i=>ITEMS[i][F.sl]);
  return list;
}
function hint(icon,title,sub){return `<div class="hint"><div class="ic"><svg class="i"><use href="#i-${icon}"/></svg></div><b>${title}</b><br>${sub}</div>`;}
function startScreen(){
  return `<div class="hint"><div class="ic"><svg class="i"><use href="#i-search"/></svg></div>
  <b>دوّر على أي صنف</b><br>اكتب جزء من الاسم بالعربي أو الإنجليزي، أو الكود، أو امسح الباركود.
  <div class="tips">
    <div><b>غلطة إملائية؟</b>عادي، «psnadol» هتجيب بنادول.</div>
    <div><b>كلمتين</b>«بنادول اكسترا» أدق من كلمة واحدة.</div>
    <div><b>دوس على الصنف</b>يطلع الباركود كبير تعمله سكان.</div>
    <div><b>إكسبريس / جلوبال / سمارت ليست</b>فلتر النتايج من فوق.</div>
  </div>
  <div class="ver">إصدار ${VER}${BUILT?' • بيانات النهدي أونلاين: '+BUILT:''}</div></div>`;
}
function render(){
  const main=$('#main');main.innerHTML='';shown=0;
  $('#exportMissing').style.display=filter==='missing'&&missing.length?'inline-flex':'none';
  const q=$('#q').value.trim();
  if(filter==='missing'){
    if(!missing.length){main.innerHTML=hint('inbox','القائمة فاضية','أي صنف تدوّر عليه وماتلاقيهوش، سجّله هنا عشان تبلّغ عنه.');return;}
    main.insertAdjacentHTML('beforeend',`<div class="count"><span><b>${missing.length}</b> صنف مش موجود</span></div>`);
    missing.slice().reverse().forEach(m=>{main.insertAdjacentHTML('beforeend',`<div class="card" style="cursor:default"><div class="info">
      <div class="nm" style="direction:ltr;text-align:right">${esc(m.q)}</div><div class="en">${new Date(m.t).toLocaleString('ar-EG')}</div>
      <div class="row"><button class="btn ghost" style="padding:7px 12px;font-size:13px" data-copy="${esc(m.q)}">نسخ</button>
      <button class="btn ghost" style="padding:7px 12px;font-size:13px;color:var(--danger)" data-del="${esc(m.q)}">حذف</button></div></div></div>`);});
    return;
  }
  let list;
  if(filter==='fav'){list=[...fav].map(c=>codeIndex.get(c)).filter(x=>x!=null);
    if(!list.length){main.innerHTML=hint('star','مفيش مفضلة لسه','دوس على النجمة في أي صنف عشان يتحفظ هنا.');return;}}
  else if(filter==='recent'){list=recent.map(c=>codeIndex.get(c)).filter(x=>x!=null);
    if(!list.length){main.innerHTML=hint('clock','مفيش أصناف فتحتها','آخر الأصناف اللي فتحتها هتظهر هنا.');return;}}
  else{
    if(!q){const H={express:['bolt',`${nExp.toLocaleString('ar-EG')} صنف إكسبريس`],global:['globe',`${nGlob.toLocaleString('ar-EG')} صنف جلوبال`],sl:['list',`${nSL.toLocaleString('ar-EG')} صنف في السمارت ليست`]};
      main.innerHTML=filter==='all'?startScreen():hint(H[filter][0],H[filter][1],'اكتب اسم الصنف أو الماركة، وهتظهر لك النتايج من النوع ده بس.');return;}
    if(q!==lastQ){lastRes=search(q);lastQ=q;}
    list=applyType(lastRes);
    if(!list.length){
      const isNum=/^\d{6,}$/.test(q);
      main.innerHTML=`<div class="notfound"><svg class="i" style="width:40px;height:40px;color:var(--mut2)"><use href="#i-inbox"/></svg>
        <h3>${lastRes.length?'مفيش نتايج من النوع ده':'الصنف مش موجود'}</h3><p>${esc(q)}</p>
        ${lastRes.length?'<button class="btn ghost" id="toAll">اعرض كل الأنواع</button>':`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="recMiss">سجّله في «مش موجود»</button>
        ${isNum?`<a class="btn ghost" target="_blank" rel="noopener" href="https://www.nahdionline.com/ar-sa/x/pdp/${encodeURIComponent(q)}"><svg class="i"><use href="#i-ext"/></svg>جرّب النهدي أونلاين</a>`:''}</div>`}</div>`;
      const r=$('#recMiss');if(r)r.onclick=()=>{addMissing(q);toast('اتسجّل في «مش موجود»');};
      const a=$('#toAll');if(a)a.onclick=()=>setFilter('all');
      return;
    }
  }
  main.insertAdjacentHTML('beforeend',`<div class="count"><span><b>${list.length.toLocaleString('ar-EG')}</b> نتيجة</span><span></span></div>`);
  const box=document.createElement('div');main.appendChild(box);
  const more=()=>{const f=document.createDocumentFragment();const end=Math.min(list.length,shown+PAGE);
    for(;shown<end;shown++)f.appendChild(card(list[shown]));box.appendChild(f);
    const old=$('#moreBtn');if(old)old.remove();
    if(shown<list.length){const b=document.createElement('button');b.className='btn ghost more';b.id='moreBtn';b.textContent='عرض المزيد ('+(list.length-shown).toLocaleString('ar-EG')+')';b.onclick=more;main.appendChild(b);io.observe(b);}};
  more();
  if(list.length===1&&/^\d{6,}$/.test(q)&&filter==='all'&&openOnSingle){openOnSingle=false;openItem(list[0]);}
}
const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){io.unobserve(e.target);e.target.click();}},{rootMargin:'400px'});
let openOnSingle=false;

/* ---------- interactions ---------- */
let tmr=null;
function onInput(){const v=$('#q').value;$('#clear').classList.toggle('show',!!v);
  HLT=v.trim().split(/\s+/).filter(Boolean);
  if(filter==='fav'||filter==='recent'||filter==='missing')setChip('all');
  clearTimeout(tmr);tmr=setTimeout(render,90);}
$('#q').addEventListener('input',onInput);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){openOnSingle=true;clearTimeout(tmr);render();$('#q').blur();}});
$('#clear').onclick=()=>{$('#q').value='';HLT=[];$('#clear').classList.remove('show');render();$('#q').focus();};
$('#chips').onclick=e=>{const c=e.target.closest('.chip');if(c)setFilter(c.dataset.f);};
function setChip(f){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.f===f));}
function setFilter(f){setChip(f);render();scrollTo({top:0});}
$('#main').addEventListener('click',e=>{
  const s=e.target.closest('[data-star]');
  if(s){e.stopPropagation();const c=s.dataset.star;fav.has(c)?fav.delete(c):fav.add(c);LS.set('fav',[...fav]);s.classList.toggle('on',fav.has(c));
    toast(fav.has(c)?'اتضاف للمفضلة':'اتشال من المفضلة');if(filter==='fav')render();return;}
  const cp=e.target.closest('[data-copy]');if(cp){copy(cp.dataset.copy);return;}
  const dl=e.target.closest('[data-del]');if(dl){missing=missing.filter(m=>m.q!==dl.dataset.del);LS.set('missing',missing);render();return;}
  const c=e.target.closest('.card[data-idx]');if(c)openItem(+c.dataset.idx);
});
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('اتنسخ: '+t)).catch(()=>{
  const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('اتنسخ: '+t);}catch(e){}a.remove();});}
function pushRecent(c){recent=[c,...recent.filter(x=>x!==c)].slice(0,50);LS.set('recent',recent);}
function addMissing(q){if(!missing.some(m=>m.q===q))missing.push({q,t:Date.now()});LS.set('missing',missing);}
$('#exportMissing').onclick=()=>{
  const csv='\ufeffالباركود/الكود,التاريخ\n'+missing.map(m=>`"${m.q}","${new Date(m.t).toLocaleString('ar-EG')}"`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='اصناف_مش_موجودة.csv';a.click();};

/* ---------- item sheet ---------- */
let bc={idx:-1,list:[],cur:0,mode:LS.get('bcmode','qr')};
function openItem(idx){
  const it=ITEMS[idx];if(!it)return;
  const list=(itemBc[idx]||[]).slice();if(!list.length)list.push(it[0]);
  bc.idx=idx;bc.list=list;bc.cur=0;
  $('#mName').textContent=it[2]||it[1];
  $('#mEn').textContent=it[1]&&it[1]!==it[2]?it[1]:'';
  const im=it[F.img];
  $('#mImg').innerHTML=im?`<img alt="" src="${imgUrl(im,400)}" onerror="this.replaceWith(document.querySelector('#tplbox').content.cloneNode(true))">`:'<svg class="i"><use href="#i-box"/></svg>';
  const pi=priceInfo(it);
  let tags=tagHTML(it[F.type]);if(pi.disc)tags+=`<span class="tag o">عرض أونلاين ${pi.disc} ر.س</span>`;
  if(it[F.sl])tags+='<span class="tag sl"><svg class="i"><use href="#i-list"/></svg>سمارت ليست</span>';
  $('#mTags').innerHTML=tags;
  const cat=CATS[it[F.cat]];
  const [cDiv,cSub]=(cat||'').split('|');
  $('#mCat').innerHTML=[cDiv?esc(cDiv):'',it[F.brand]?`<b dir="ltr">${esc(it[F.brand])}</b>`:'',cSub?`<span dir="ltr">${esc(cSub)}</span>`:''].filter(Boolean).join(' • ');
  const store=fmt(it[F.price]);
  let mainL='السعر',extra='';
  if(pi.src==='s'){
    if(pi.vat===1){mainL='السعر شامل الضريبة';extra=row('قبل الضريبة (ملف الأصناف)',pi.pre);}
    else if(pi.vat===0){mainL='السعر (دواء • بدون ضريبة)';}
    else{mainL='سعر ملف الأصناف';extra=row('لو الصنف مش دواء • شامل الضريبة 15%',fmt(pi.pre*VAT));}
    if(pi.on&&pi.on!==pi.v)extra+=row('النهدي أونلاين (شامل الضريبة)',pi.disc||pi.on,pi.disc?pi.on:'');
  }else if(pi.src==='o'){mainL='النهدي أونلاين (شامل الضريبة)';if(pi.disc)extra=row('عرض أونلاين',pi.disc,pi.on);}
  $('#mPrices').innerHTML=
    `<div class="pbox main"><div class="l">${mainL}</div><div class="v">${pi.v?pi.v+' <small>ر.س</small>':'<small>غير مسجّل</small>'}</div></div>`+
    `<div class="pbox code" data-copy="${esc(it[0])}"><div class="l">كود الصنف</div><div class="v">${esc(it[0])}</div></div>`+extra;
  $('#bcOther').innerHTML=list.length>1?list.map((b,i)=>`<button class="bcchip${i?'':' on'}" data-i="${i}">${b}</button>`).join(''):'';
  $('#mActs').innerHTML=`<button class="btn light" data-copy="${esc(list[0])}" id="cpBc"><svg class="i"><use href="#i-copy"/></svg>نسخ الباركود</button>`+
    (it[F.type]||im?`<a class="btn" target="_blank" rel="noopener" href="https://www.nahdionline.com/ar-sa/x/pdp/${esc(it[0])}"><svg class="i"><use href="#i-ext"/></svg>النهدي أونلاين</a>`:
    `<button class="btn light" data-star2="${esc(it[0])}"><svg class="i"><use href="#i-star"/></svg>${fav.has(it[0])?'شيله من المفضلة':'ضيفه للمفضلة'}</button>`);
  setMode(bc.mode);
  pushRecent(it[0]);
  $('#modal').classList.add('show');history.pushState({m:1},'');
}
function draw(){
  const v=bc.list[bc.cur];$('#bcNum').textContent=v;const view=$('#bcView');view.innerHTML='';
  const cb=$('#cpBc');if(cb)cb.dataset.copy=v;
  try{
    if(bc.mode==='qr'){const q=qrcode(0,'M');q.addData(v);q.make();view.innerHTML=q.createSvgTag({cellSize:7,margin:2,scalable:true});}
    else{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');view.appendChild(s);
      const fmt13=/^\d{13}$/.test(v);
      try{JsBarcode(s,v,{format:fmt13?'EAN13':'CODE128',width:2.4,height:120,displayValue:false,margin:8});}
      catch(e){JsBarcode(s,v,{format:'CODE128',width:2.4,height:120,displayValue:false,margin:8});}}
  }catch(e){view.innerHTML='<div style="color:#b91c1c;font-weight:800">تعذّر عرض الباركود</div>';}
  document.querySelectorAll('.bcchip').forEach(c=>c.classList.toggle('on',+c.dataset.i===bc.cur));
}
function setMode(m){bc.mode=m;LS.set('bcmode',m);$('#tgQR').classList.toggle('active',m==='qr');$('#tg1D').classList.toggle('active',m!=='qr');draw();}
$('#tgQR').onclick=()=>setMode('qr');$('#tg1D').onclick=()=>setMode('1d');
$('#tgBright').onclick=function(){$('#modal').classList.toggle('bright',this.classList.toggle('active'));};
$('#bcOther').onclick=e=>{const c=e.target.closest('.bcchip');if(c){bc.cur=+c.dataset.i;draw();}};
$('#sheet').addEventListener('click',e=>{const cp=e.target.closest('[data-copy]');if(cp)copy(cp.dataset.copy);
  const s=e.target.closest('[data-star2]');if(s){const c=s.dataset.star2;fav.has(c)?fav.delete(c):fav.add(c);LS.set('fav',[...fav]);toast(fav.has(c)?'اتضاف للمفضلة':'اتشال من المفضلة');openItem(bc.idx);history.back();}});
function closeModal(){if($('#modal').classList.contains('show')){$('#modal').classList.remove('show','bright');$('#tgBright').classList.remove('active');
  if(filter==='recent')render();}}
$('#mClose').onclick=()=>history.back();
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')history.back();});
addEventListener('popstate',()=>{closeModal();closeScanner();});

/* ---------- scanner ---------- */
let stream=null,scanning=false,zx=null,track=null;
$('#scan').onclick=openScanner;$('#closeScan').onclick=()=>history.back();
async function openScanner(){
  $('#scanner').classList.add('show');history.pushState({s:1},'');$('#scanHint').textContent='وجّه الكاميرا على الباركود';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
    const v=$('#video');v.srcObject=stream;await v.play();scanning=true;
    track=stream.getVideoTracks()[0];
    try{const c=track.getCapabilities&&track.getCapabilities();if(c&&c.torch)$('#torch').style.display='grid';
      if(c&&c.focusMode&&c.focusMode.includes('continuous'))track.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','codabar','qr_code','data_matrix']});
      const loop=async()=>{if(!scanning)return;try{const r=await det.detect(v);if(r.length)return onScan(r[0].rawValue);}catch(e){}setTimeout(loop,80);};loop();
    }else{
      await loadScript('zxing.min.js');
      zx=new ZXing.BrowserMultiFormatReader();
      zx.decodeFromVideoElementContinuously(v,(r)=>{if(r&&scanning)onScan(r.getText());});
    }
  }catch(e){$('#scanHint').textContent='الكاميرا مش متاحة — اسمح بالإذن وجرّب تاني';console.error(e);}
}
function loadScript(src){return new Promise((ok,no)=>{if(window.ZXing)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
$('#torch').onclick=async function(){if(!track)return;const on=!this.classList.contains('on');try{await track.applyConstraints({advanced:[{torch:on}]});this.classList.toggle('on',on);}catch(e){}};
function onScan(val){
  if(!scanning)return;scanning=false;
  navigator.vibrate&&navigator.vibrate(70);
  history.back();
  setTimeout(()=>{$('#q').value=val;HLT=[];$('#clear').classList.add('show');setChip('all');lastQ='';openOnSingle=true;render();
    if(!lastRes.length)toast('الصنف مش موجود');},60);
}
function closeScanner(){
  if(!$('#scanner').classList.contains('show'))return;
  scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  if(zx){try{zx.reset();}catch(e){}zx=null;}
  $('#video').srcObject=null;$('#torch').style.display='none';$('#torch').classList.remove('on');
  $('#scanner').classList.remove('show');
}

/* ---------- misc ---------- */
let tt=null;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1700);}
function net(){const n=$('#net'),on=navigator.onLine;n.classList.toggle('on',on);n.textContent=on?'متصل':'أوفلاين';}
addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});
  let reloaded=!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded&&!$('#modal').classList.contains('show')){reloaded=true;toast('تم التحديث لآخر إصدار');}});}
load();
</script>
<template id="tplbox"><svg class="i" style="width:30px;height:30px;color:#a3b1c4"><use href="#i-pill"/></svg></template>
</body>
</html>
